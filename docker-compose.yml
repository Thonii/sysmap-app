version: '3.8'

services:
  sysmap_backend:
    build:
      context: ./codigo_fuente/backend
      dockerfile: Dockerfile
    container_name: sysmap_backend
    restart: always
    environment:
      - DATABASE_URL=sqlite:////app/database/sysmap.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EVENTBRITE_API_TOKEN=${EVENTBRITE_API_KEY}
      - PORT=8000
    volumes:
      - sysmap_db_data:/app/database
    networks:
      - tecnoancon-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sysmap_backend.rule=Host(`${SYSMAP_HOST}`) && PathPrefix(`/api`) && !PathPrefix(`/api/auth`) && !PathPrefix(`/api/preferences`) && !PathPrefix(`/api/saved-events`) && !PathPrefix(`/api/leads`)"
      - "traefik.http.routers.sysmap_backend.entrypoints=websecure"
      - "traefik.http.routers.sysmap_backend.tls=true"
      - "traefik.http.routers.sysmap_backend.tls.certresolver=letsencrypt"
      - "traefik.http.middlewares.sysmap_strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.sysmap_backend.middlewares=sysmap_strip,secHeaders@file"
      - "traefik.http.services.sysmap_backend.loadbalancer.server.port=8000"

  sysmap_frontend:
    build:
      context: ./codigo_fuente/frontend
      dockerfile: Dockerfile
    container_name: sysmap_frontend
    restart: always
    environment:
      - DATABASE_URL=file:/app/database/sysmap.db
      - NEXTAUTH_URL=https://${SYSMAP_HOST}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - NEXT_PUBLIC_VITE_API_BASE_URL=https://${SYSMAP_HOST}/api
      - PORT=3000
    volumes:
      - sysmap_db_data:/app/database
    networks:
      - tecnoancon-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sysmap_frontend.rule=Host(`${SYSMAP_HOST}`)"
      - "traefik.http.routers.sysmap_frontend.entrypoints=websecure"
      - "traefik.http.routers.sysmap_frontend.tls=true"
      - "traefik.http.routers.sysmap_frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sysmap_frontend.middlewares=secHeaders@file"
      - "traefik.http.services.sysmap_frontend.loadbalancer.server.port=3000"

volumes:
  sysmap_db_data:

networks:
  tecnoancon-proxy:
    external: true
